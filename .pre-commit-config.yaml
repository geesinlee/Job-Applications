# fleet-governance v0.1.2 — generated by `fleet-sdk governance sync --repo`.
# Install once: pipx install "fleet-sdk @ git+https://github.com/geesinlee/fleet-sdk@v0.1.2" && pre-commit install
repos:
  - repo: local
    hooks:
      - id: fleet-compliance
        name: fleet-sdk compliance
        entry: fleet-sdk compliance --repo .
        language: system
        pass_filenames: false
        always_run: true
