# fleet-governance v0.1.2 — generated by `fleet-sdk governance sync --repo`. Do not edit.
name: Fleet Harness Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  fleet-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check fleet-sdk deploy key
        env:
          HAS_KEY: ${{ secrets.FLEET_SDK_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::FLEET_SDK_DEPLOY_KEY secret missing (read-only deploy key on geesinlee/fleet-sdk)"; exit 1
          fi
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FLEET_SDK_DEPLOY_KEY }}
      - name: Install fleet-sdk v0.1.2
        run: |
          git config --global url."git@github.com:geesinlee/fleet-sdk".insteadOf "https://github.com/geesinlee/fleet-sdk"
          pip install "fleet-sdk @ git+https://github.com/geesinlee/fleet-sdk@v0.1.2"
      - name: Compliance (secrets, LAN IPs, notification bypass, domain boundaries)
        run: fleet-sdk compliance --repo .
      - name: Governance drift
        run: fleet-sdk governance audit --repo .
