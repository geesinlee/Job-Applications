name: Fleet DevSecOps & Harness Gate

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  devsecops-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enforce Centralized Notification Service (harness.notify) & Guardrails
        run: |
          echo "Scanning repository for unmanaged notification bypasses, secrets, and hardcoded LAN IPs..."
          python3 - <<'PY'
          import pathlib, re, sys
          bypass_re = re.compile(r"(api\.telegram\.org/bot|\bsmtplib\.SMTP(?:_SSL)?\s*\(|from\s+(?:scripts\.)?send_telegram_escalation\s+import)")
          allow = {"engine.py", "fleet_telegram_bot.py", "guardrails.py", "lint_domain_boundaries.py", "fleet_harness_enforce.py"}
          violations = []
          for p in pathlib.Path(".").rglob("*.py"):
              if any(part in p.parts for part in (".git", ".venv", "venv", "node_modules", "tests")) or p.name in allow:
                  continue
              txt = p.read_text(encoding="utf-8", errors="ignore")
              if "devsecops-allowlist" in txt[:600]:
                  continue
              for idx, line in enumerate(txt.splitlines(), 1):
                  if not line.lstrip().startswith("#") and bypass_re.search(line):
                      violations.append(f"{p}:{idx}: UNMANAGED_NOTIFICATION_BYPASS (must use harness.notify)")
          if violations:
              print("\\n".join(violations))
              sys.exit(1)
          print("All notification and DevSecOps checks passed.")
          PY
