name: Fleet CI/CD Governance & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-governance:
    name: Security & Architecture Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate .gitignore completeness & check no tracked secrets
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "CRITICAL: .env file is tracked by git!"
            exit 1
          fi
          # Check for forbidden private key or secret patterns
          if git grep -I -E "BEGIN (RSA|EC|OPENSSH) PRIVATE KEY" -- ':!*.test.*' ':!*.md'; then
            echo "CRITICAL: Plaintext private key found!"
            exit 1
          fi

      - name: Run Zero-LAN-IP Exposure Linter
        run: |
          python3 scripts/lint_no_hardcoded_ips.py

      - name: Check for Exposed Secrets
        run: |
          python3 scripts/secret_rotation_engine.py --ci-check

      - name: Run Fleet Domain Boundary Linter
        run: |
          python3 scripts/lint_domain_boundaries.py --repo . --strict

  python-build-and-test:
    name: Python Build & Functional/Security Test Suite
    needs: security-and-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install System Dependencies for PDF Export
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax Check Python Codebase
        run: |
          python3 -m compileall src tests .

      - name: Run Full Test Suite (Functional & Security)
        run: |
          pytest -v --tb=short
