[Service]
# Pi-4 pilot activation: execute orchestration, but do NOT update stages yet.
# Align environment with NAS runtime paths.
Environment=JOB_APP_ORCHESTRATION_ENABLED=true
Environment=JOB_APP_ORCHESTRATION_EXECUTE=true
Environment=JOB_APP_ORCHESTRATION_UPDATE_STAGE=false
Environment=JOB_APP_BASE_DIR=/mnt/job-app-data
Environment=JOB_APP_ARTEFACTS_DIR=/mnt/job-app-data
Environment=JOB_APP_TRACKER_PATH=/mnt/job-app-data/tracker.json
Environment=JOB_APP_PROFILE_PATH=/mnt/job-app-data/profile.json
